name: zerotrust_gallery
description: "Zero-Trust Gallery: your phone's photos, your encrypted account photos and end-to-end encrypted shared albums."
publish_to: none
version: 0.2.2+4

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Core PR #73 (feat/companion-app-data-and-shared-album-files): dataAppId,
  # so Gallery opens ZT Camera's photos, and shared album files. Move to the
  # Dev merge commit once it is in, then to the next tag. Never add
  # cryptography_flutter: it breaks the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      # The core commit this app used before, plus the import-freeze fix of
      # Core PR #89 and #90. It lives on the Core branch
      # backport/import-freeze-fix-on-core-f4ae98e: keep that branch until
      # this pin moves to a core that has the fix.
      ref: 918b656557a2c0db47b32db475e2da2062e5d5f1
  # Shared albums: invite by link or QR, join, members (Z24 shared spaces).
  # Same repository and commit as zero_trust_core.
  zt_sharing_ui:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_sharing_ui
      ref: 918b656557a2c0db47b32db475e2da2062e5d5f1
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Reset links from account emails (EmailLinks).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1
  # The phone's photos and videos (Android MediaStore), and their previews.
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  # Re-saving a photo without its hidden details before it is shared.
  image: ^4.5.4
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  video_player: ^2.10.0

dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Gallery runs them as `camera`: it opens Camera's data.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: 918b656557a2c0db47b32db475e2da2062e5d5f1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
